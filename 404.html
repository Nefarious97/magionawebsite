<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mangiona - Fast, fresh, and reliable food delivery service. Order your favourite meals online and track your delivery.">
    <meta name="keywords" content="Mangiona, food delivery, order food online, fast food, meals, restaurant">
    <meta property="og:title" content="Mangiona | Food Delivery">
    <meta property="og:description" content="Fast, fresh, and reliable food delivery service. Order your favourite meals online and track your delivery.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="image/Logo m 2.png">
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS-files/global-sync.css">
    <link rel="shortcut icon" href="image/Logo m 2.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Open Sans', 'Manrope', arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        @keyframes floatAnim {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        img {
            height: 350px;
            object-fit: contain;
            margin-bottom: 30px;
            animation: floatAnim 3.5s infinite ease-in-out;
        }
        .error-message {
            font-size: 38px;
            font-weight: 800;
            color: #111;
            margin-bottom: 15px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        .instructions {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            max-width: 400px;
            line-height: 1.6;
        }
        .back-btn {
            background-color: #FF6B00;
            color: #fff;
            border: none;
            padding: 16px 40px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(4, 120, 87, 0.2);
        }
        .back-btn:hover {
            background-color: #03664a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(4, 120, 87, 0.3);
        }
        .back-btn:active {
            transform: translateY(0);
        }
        @media (max-width: 600px) {
            img { height: 250px; }
            .error-message { font-size: 28px; }
            .instructions { font-size: 16px; }
        }
    </style>
</head>
<body>
    <img src="image/404.png" alt="404 Error - Page Not Found">
    <h1 class="error-message">Looks like this page got lost!</h1>
    <p class="instructions">We couldn't find the page you were looking for. Let's get you back to the fresh, hot meals.</p>
    <a href="index.html" class="back-btn">Go Back Home</a>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js" defer></script>
    <script src="Javascript-files/script.js"></script>
</body>
</html>
